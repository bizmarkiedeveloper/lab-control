name: Security & DevSecOps Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-analysis:
    name: Executar Análises de Segurança
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v3

      - name: 2. Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Detecção de Credenciais e Segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Análise Estática de Segurança do Código (Bandit)
        run: |
          pip install bandit
          bandit -r src/

      - name: 5. Instalar Dependências para Teste
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 6. Checagem de Vulnerabilidades nas Dependências (Safety)
        run: |
          pip install safety
          safety check --full-report || true
